name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'
        cache: true

    - name: Create Clean Flutter Project
      run: |
        flutter create . --org com.laila.net --project-name laila_net --platforms android
        rm -rf lib/*
        git checkout lib/

    - name: Fix minSdkVersion for V2Ray
      run: |
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
        sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle

    - name: Get Dependencies
      run: flutter pub get

    - name: Generate App Launcher Icons
      run: flutter pub run flutter_launcher_icons -i launcher_icon

    - name: Build Release APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
